; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =============================================================================
; Semáforo Inteligente — PlatformIO Configuration
; =============================================================================
; Mapeamento de pinos (Arduino Uno — pinos 0-1 reservados para Serial):
;
;   Rua 1 — Carros   : Verde=4  | Amarelo=12 | Vermelho=5
;   Rua 2 — Carros   : Verde=6  | Amarelo=13 | Vermelho=7
;   Ped Rua 1 (x2)   : Verde=8  | Vermelho=9
;   Ped Rua 2 (x2)   : Verde=10 | Vermelho=11
;   Botão Rua 1      : pino 2   (interrupção INT0)
;   Botão Rua 2      : pino 3   (interrupção INT1)
;
; Total: 10 pinos de saída + 2 pinos de entrada = 12 pinos (cabe no Uno).
; =============================================================================

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 9600
upload_speed = 115200
